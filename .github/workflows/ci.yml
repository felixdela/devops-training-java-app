# Práctica 3 - GitHub Actions (dummy)
#
# Punto de partida: workflow mínimo para validar que Actions funciona en el repo.
# En la Práctica 3 irás ampliando este workflow para llegar a CI/CD.

name: CI (dummy)

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - develop
      - master

  workflow_dispatch:
    inputs:
      RUN_CD:
        description: "Run CD pipeline"
        required: false
        default: false
        type: boolean

# Variables a nivel de WORKFLOW
env:
  IMAGE_NAME: devops-training-java-app
  APP_URL: https://dev.example.com

jobs:
  ci:
    runs-on: ubuntu-latest

    # Sobrescribimos una variable a nivel de JOB
    env:
      APP_URL: https://staging.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostrar variables con env context
        run: |
          echo "Image name (context): ${{ env.IMAGE_NAME }}"
          echo "App URL (context): ${{ env.APP_URL }}"

      - name: Mostrar variables en shell
        run: |
          echo "Image name (shell): $IMAGE_NAME"
          echo "App URL (shell): $APP_URL"
