# Práctica 3 - GitHub Actions (dummy)
name: CI (dummy)

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - develop
      - master

  workflow_dispatch:
    inputs:
      RUN_CD:
        description: "Run CD pipeline"
        required: false
        default: false
        type: boolean
      DEPLOY_ENV:
        description: "Environment to deploy"
        required: false
        type: choice
        options:
          - DEV
          - PRO

# Variables a nivel de workflow
env:
  IMAGE_NAME: devops-training-java-app
  APP_URL: https://dev.example.com
  APP_DOCKERFILE: devops/Dockerfile

jobs:
  ci:
    runs-on: ubuntu-latest

    # seleccionar environment según rama
    environment: ${{ github.ref_name == 'master' && 'PRO' || 'DEV' }}

    # Sobrescribimos variable para ver precedencia
    env:
      APP_URL: https://staging.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Info runner
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Name: ${{ runner.name }}"

      - name: Mostrar variables env
        run: |
          echo "Image name: $IMAGE_NAME"
          echo "App URL: $APP_URL"

      - name: Mostrar inputs manuales
        run: |
          echo "RUN_CD: ${{ inputs.RUN_CD }}"
          echo "DEPLOY_ENV: ${{ inputs.DEPLOY_ENV }}"

      - name: Mostrar variables del environment
        run: |
          echo "Registry host: ${{ vars.REGISTRY_HOST }}"
          echo "Artifactory URL: ${{ vars.ARTIFACTORY_URL }}"

      - name: Usar secret (ejemplo)
        run: |
          echo "Registry user configurado correctamente"
          echo "User: ${{ secrets.REGISTRY_USER }}"

      - name: Build CI Docker image
        run: docker build -t ci-java -f devops/ci.Dockerfile .

      - name: Run lint and tests in CI container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            ci-java \
            make lint test

      - name: Build application Docker image
        run: |
          docker build -t $IMAGE_NAME -f $APP_DOCKERFILE .
