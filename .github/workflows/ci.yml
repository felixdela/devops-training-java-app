# Práctica 3 - GitHub Actions (dummy)
#
# Punto de partida: workflow mínimo para validar que Actions funciona en el repo.
# En la Práctica 3 irás ampliando este workflow para llegar a CI/CD.

name: CI (dummy)

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - develop
      - master

  workflow_dispatch:
    inputs:
      RUN_CD:
        description: "Run CD pipeline"
        required: false
        default: false
        type: boolean

      DEPLOY_ENV:
        description: "Environment to deploy"
        required: false
        type: choice
        options:
          - DEV
          - PRO

# Variables a nivel de workflow
env:
  IMAGE_NAME: devops-training-java-app
  APP_URL: https://dev.example.com

jobs:
  ci:
    runs-on: ubuntu-latest

    # Sobrescribimos variable para ver precedencia
    env:
      APP_URL: https://staging.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Info runner
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Name: ${{ runner.name }}"

      - name: Mostrar variables env
        run: |
          echo "Image name: $IMAGE_NAME"
          echo "App URL: $APP_URL"

      - name: Mostrar inputs manuales
        run: |
          echo "RUN_CD: ${{ inputs.RUN_CD }}"
          echo "DEPLOY_ENV: ${{ inputs.DEPLOY_ENV }}"
